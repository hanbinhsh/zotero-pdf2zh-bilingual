<?xml version="1.0"?>
<!-- prettier-ignore -->
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<!-- prettier-ignore -->
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<!-- prettier-ignore -->
<?xml-stylesheet href="chrome://zotero-platform/content/zotero-react-client.css" type="text/css"?>
<!-- prettier-ignore -->
<?xml-stylesheet href="chrome://zotero-platform/content/zotero.css" type="text/css"?>
<!-- prettier-ignore -->
<!DOCTYPE html>
<html
  id="__addonRef__-taskManager"
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  windowtype="__addonRef__-taskManager"
  sizemode="normal"
  scrolling="false"
  persist="screenX screenY width height sizemode"
>
  <head>
    <title data-l10n-id="taskManager-title"></title>
    <meta charset="utf-8" />
    <xul:linkset>
      <link rel="localization" href="browser/menubar.ftl" />
      <link rel="localization" href="browser/browserSets.ftl" />
      <link rel="localization" href="toolkit/global/textActions.ftl" />
      <link rel="localization" href="zotero.ftl" />
      <link rel="localization" href="__addonRef__-taskManager.ftl" />
    </xul:linkset>
    <xul:commandset id="mainCommandSet">
      <xul:command id="cmd_close" oncommand="window.close()" />
    </xul:commandset>
    <xul:keyset id="mainKeyset">
      <xul:key
        id="key_close"
        command="cmd_close"
        modifiers="accel"
        reserved="true"
      />
    </xul:keyset>
    <script>
      document.addEventListener("DOMContentLoaded", (ev) => {
        Services.scriptloader.loadSubScript(
          "chrome://zotero/content/include.js",
          this,
        );
        window.arguments[0]._initPromise.resolve();
      });
    </script>
    <style>
      html,
      body {
        min-width: 800px;
        min-height: 400px;
      }
      html,
      body,
      .viewport {
        padding: 0;
        margin: 0;
        height: 100%;
        overflow: hidden;
        word-wrap: break-word;
        user-select: none;
      }
      .viewport {
        margin: 0;
        overflow-y: auto;
      }
      .viewport-container {
        padding: 0;
        margin: 0;
        height: calc(100% - 50px);
        width: 100%;
        display: flex;
        flex-direction: row;
        overflow: hidden;
        background: var(--material-background);
      }
      .list-viewport {
        width: 100%;
        overflow: hidden;
      }
      #table-container {
        height: 100%;
        width: 100%;
        overflow: auto;
      }
      #manager-table {
        height: 100%;
      }
      .footer-container {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 8px 12px;
        gap: 8px;
        background: var(--material-background);
        border-top: 1px solid var(--material-border, rgba(128, 128, 128, 0.2));
      }
      .footer-container button {
        padding: 4px 10px;
      }
    </style>
  </head>
  <body class="zotero-window">
    <div class="viewport-container">
      <div id="list-container" class="viewport list-viewport">
        <div id="table-container"></div>
      </div>
    </div>
    <div
      class="footer-container"
      xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    >
      <button id="refresh" data-l10n-id="refresh"></button>
      <button id="view-pdf" data-l10n-id="view-pdf"></button>
      <button id="retry" data-l10n-id="retry"></button>
      <button id="cancel" data-l10n-id="cancel"></button>
      <button id="clearQueue" data-l10n-id="clearQueue"></button>
      <div style="flex: 1"></div>
      <button id="feedback" data-l10n-id="feedback"></button>
    </div>
  </body>
</html>
